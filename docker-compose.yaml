version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lifetime-cv-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-lifetime_cv}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=en_US.UTF-8'
      TZ: 'Europe/Madrid'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lifetime-cv-network

volumes:
  postgres_data:
    driver: local

networks:
  lifetime-cv-network:
    driver: bridge